[project]
name = "netwatch-enterprise"
version = "0.1.0"
description = "Enterprise infrastructure monitoring platform"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "jinja2>=3.1,<4.0",
  "sqlalchemy>=2.0,<3.0",
  "asyncpg>=0.29,<1.0",
  "aiosqlite>=0.20,<1.0",
  "pydantic-settings>=2.6,<3.0",
  "httpx>=0.27,<1.0",
  "apscheduler>=3.10,<4.0",
  "scikit-learn>=1.5,<2.0",
  "psutil>=6.0,<7.0",
  "python-multipart>=0.0.12,<1.0",
  "itsdangerous>=2.2,<3.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
  "ruff>=0.8,<1.0",
]

[project.scripts]
netwatch = "app.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
