{% extends "auth_base.html" %}
{% block title %}Sign In{% endblock %}
{% block content %}<main class="page-content auth-page"><section class="auth-card panel"><p class="eyebrow">Identity / Secure access</p><h1>Sign in to NetWatch</h1><p class="subtitle">Access your monitoring workspace and account settings.</p>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" class="account-form"><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" required autocomplete="current-password"></label><button class="refresh-button" type="submit">Sign in <span>→</span></button></form><p class="auth-footer">New to NetWatch? <a href="/account/register">Create an account</a></p></section></main>{% endblock %}
