{% extends "auth_base.html" %}
{% block title %}Create Account{% endblock %}
{% block content %}<main class="page-content auth-page"><section class="auth-card panel"><p class="eyebrow">Identity / New account</p><h1>Create your account</h1><p class="subtitle">Join the NetWatch operations workspace.</p>{% if error %}<div class="form-error">{{ error }}</div>{% endif %}<form method="post" class="account-form"><label>Full name<input name="full_name" required autocomplete="name"></label><label>Email address<input name="email" type="email" required autocomplete="email"></label><label>Password<input name="password" type="password" minlength="8" required autocomplete="new-password"><small>Use at least 8 characters.</small></label><button class="refresh-button" type="submit">Create account <span>→</span></button></form><p class="auth-footer">Already registered? <a href="/account/login">Sign in</a></p></section></main>{% endblock %}
